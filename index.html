<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>零件報價查詢</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d5dbe4;--accent:#1f5eff;--price:#0b7a4b;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--panel:#18213a;--ink:#e8edf7;--mute:#97a4bd;--line:#2c3856;--accent:#6b97ff;--price:#4fd69a;--danger:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:.02em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:88px 1fr 140px;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cat{font-weight:700;font-size:17px}
select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.price{text-align:right;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--price)}
.price.empty{color:var(--mute);font-weight:400;font-size:18px}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:18px;background:var(--ink);color:var(--bg);border-radius:10px}
.sum{font-size:clamp(28px,7vw,40px);font-weight:900;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:500;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--bg);cursor:pointer}
.note{color:var(--mute);font-size:13px;margin-top:14px}
.err{color:var(--danger);padding:16px 18px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.foot .note{margin:0}
.ver{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.foot button{color:var(--ink);background:var(--panel);min-height:36px;padding:0 14px;font-size:14px}
@media (max-width:560px){.row{grid-template-columns:1fr auto;grid-template-areas:"c p" "s s"}.cat{grid-area:c}.price{grid-area:p}.row select{grid-area:s}}
</style>
</head>
<body>
<main>
  <h1>零件報價查詢</h1>
  <p class="sub">選擇各分類的品項，右側會顯示對應金額。</p>
  <div class="card" id="list"><div class="row">載入中…</div></div>
  <div class="total">
    <div><div>已選品項合計</div><div class="sum" id="sum">NT$ 0</div></div>
    <button id="reset" type="button">全部清除</button>
  </div>
  <p class="note">價格僅供參考，實際金額以現場報價為準。</p>
  <div class="foot">
    <span class="ver" id="ver">版本載入中…</span>
    <button id="force" type="button">強制重新整理</button>
  </div>
</main>
<!--
  ===== 價格資料區：要改價格、新增分類或品項，只改這一段 =====
  version / updated：每次改價格時請一起更新，頁面底部會顯示
  categories：每個分類有 name（分類名稱）和 items（品項清單）
  items 裡的 label 是品牌型號，price 是金額（只填數字）
  注意：逗號和雙引號要保留，少一個頁面就會出錯
  以下品牌和價格為範例，請換成實際資料
-->
<script type="application/json" id="data">
{
  "version": "1.0",
  "updated": "2026-11-20",
  "categories": [
    { "name": "車架", "items": [
      { "label": "Giant TCR Advanced", "price": 68000 },
      { "label": "Trek Madone SL", "price": 92000 },
      { "label": "Specialized Tarmac SL8", "price": 105000 },
      { "label": "Merida Scultura", "price": 58000 }
    ] },
    { "name": "避震", "items": [
      { "label": "RockShox SID SL", "price": 24500 },
      { "label": "Fox 32 Step-Cast", "price": 27800 },
      { "label": "Manitou Markhor", "price": 19800 }
    ] },
    { "name": "輪胎", "items": [
      { "label": "Continental GP5000", "price": 1850 },
      { "label": "Schwalbe Pro One", "price": 1650 },
      { "label": "Maxxis Rekon Race", "price": 1450 },
      { "label": "Vittoria Corsa Pro", "price": 1900 }
    ] },
    { "name": "輪框", "items": [
      { "label": "Zipp 303 Firecrest", "price": 42000 },
      { "label": "DT Swiss ARC 1100", "price": 38000 },
      { "label": "Mavic Cosmic SL", "price": 31000 }
    ] }
  ]
}
</script>

<script>
const $ = id => document.getElementById(id);
const fmt = n => "NT$ " + n.toLocaleString("en-US");
const el = (t, p = {}, ...k) => { const e = Object.assign(document.createElement(t), p); e.append(...k); return e; };
let rows = [];

const EMBED = JSON.parse($("data").textContent);
// 先用頁面內建的價格顯示，再偷偷重新下載一次網頁（網址加時間參數、不用快取），
// 如果發現價格資料比較新，就直接更新畫面，避免客人看到舊價格
async function loadData() {
  const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), "text/html");
  return JSON.parse(doc.getElementById("data").textContent);
}
const PAGE_VERSION = "v1.2"; // 網頁程式有改動時，請手動調高這個版本號
function showVersion(raw) {
  const v = Array.isArray(raw) ? "" : (raw.version || "");
  const u = Array.isArray(raw) ? "" : (raw.updated || "");
  $("ver").textContent = "網頁 " + PAGE_VERSION + (v ? "　價格 v" + v : "") + (u ? "（更新於 " + u + "）" : "");
}
function render(raw) {
  const data = Array.isArray(raw) ? raw : raw.categories;
  showVersion(raw);
  const keep = {};
  rows.forEach(({ sel, cat }) => { if (sel.value !== "") keep[cat.name] = cat.items[+sel.value].label; });
  const list = $("list"); list.replaceChildren(); rows = [];
  data.forEach((cat, ci) => {
    const sel = el("select", { id: "cat" + ci }, el("option", { value: "", textContent: "請選擇品項" }));
    cat.items.forEach((it, i) => sel.append(el("option", { value: i, textContent: it.label })));
    const idx = cat.items.findIndex(it => it.label === keep[cat.name]);
    if (idx >= 0) sel.value = idx;
    const price = el("div", { className: "price empty", textContent: "—" });
    price.setAttribute("aria-live", "polite");
    sel.addEventListener("change", update);
    list.append(el("div", { className: "row" }, el("label", { className: "cat", htmlFor: "cat" + ci, textContent: cat.name }), sel, price));
    rows.push({ sel, price, cat });
  });
  update();
}
function update() {
  let total = 0;
  rows.forEach(({ sel, price, cat }) => {
    if (sel.value === "") { price.textContent = "—"; price.className = "price empty"; return; }
    const p = cat.items[+sel.value].price; total += p;
    price.textContent = fmt(p); price.className = "price";
  });
  $("sum").textContent = fmt(total);
}
async function refresh() {
  try { render(await loadData()); }
  catch (e) { if (!rows.length) $("list").replaceChildren(el("div", { className: "err", textContent: "價格資料載入失敗，請重新整理頁面。" })); }
}
$("reset").addEventListener("click", () => { rows.forEach(r => r.sel.value = ""); update(); });
// 客人切回這個分頁時自動更新價格
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
// 強制重新整理：網址加上時間參數，連網頁本身也重新下載
$("force").addEventListener("click", () => {
  location.href = location.pathname + "?r=" + Date.now();
});
// 重整後把網址上的參數清掉，保持網址乾淨
if (location.search.startsWith("?r=")) history.replaceState(null, "", location.pathname);
render(EMBED);
refresh();
</script>
</body>
</html>
