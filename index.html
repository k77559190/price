<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>零件報價查詢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d5dbe4;--accent:#1f5eff;--accent-ink:#fff;--price:#0b7a4b;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--panel:#18213a;--ink:#e8edf7;--mute:#97a4bd;--line:#2c3856;--accent:#6b97ff;--accent-ink:#0f1624;--price:#4fd69a;--danger:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0f1624;--panel:#18213a;--ink:#e8edf7;--mute:#97a4bd;--line:#2c3856;--accent:#6b97ff;--accent-ink:#0f1624;--price:#4fd69a;--danger:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:28px 16px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:.02em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:88px 1fr 140px;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cat{font-weight:700;font-size:17px}
select,input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.price{text-align:right;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--price)}
.price.empty{color:var(--mute);font-weight:400;font-size:18px}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:18px;background:var(--ink);color:var(--bg);border-radius:10px}
.total .sum{font-size:clamp(28px,7vw,40px);font-weight:900;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:500;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.total button{background:transparent;color:var(--bg)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
button.small{min-height:36px;padding:0 12px;font-size:14px}
.note{color:var(--mute);font-size:13px;margin-top:14px}
/* 管理模式 */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .grow{flex:1;color:var(--mute);font-size:14px;min-width:160px}
.acat{padding:16px 18px;border-bottom:1px solid var(--line)}
.acat:last-child{border-bottom:0}
.acat-head{display:flex;gap:8px;margin-bottom:10px}
.acat-head input{font-weight:700}
.item{display:grid;grid-template-columns:1fr 130px auto;gap:8px;margin-bottom:8px}
.msg{margin-top:12px;min-height:22px;font-size:14px;color:var(--danger)}
@media (max-width:560px){
.row{grid-template-columns:1fr auto;grid-template-areas:"c p" "s s"}.cat{grid-area:c}.price{grid-area:p}.row select{grid-area:s}
.item{grid-template-columns:1fr 100px auto}}
</style>
<style>artifact-sync,artifact-local{display:contents}</style></head>
<body>
<main>
  <div class="head">
    <div>
      <h1>零件報價查詢</h1>
      <p class="sub">選擇各分類的品項，右側會顯示對應金額。</p>
    </div>
    <button id="manage" type="button" hidden="">管理模式</button>
  </div>

  <section id="view">
    <div class="card" id="list"></div>
    <div class="total">
      <div><div>已選品項合計</div><div class="sum" id="sum">NT$ 0</div></div>
      <button id="reset" type="button">全部清除</button>
    </div>
    <p class="note">價格僅供參考，實際金額以現場報價為準。</p>
  </section>

  <section id="admin" hidden=""></section>
</main>

<script type="application/json" id="data">[{"name":"車架","items":[{"label":"ABCD","price":58000}]},{"name":"避震","items":[{"label":"RockShox SID SL","price":24500},{"label":"Fox 32 Step-Cast","price":27800},{"label":"Manitou Markhor","price":19800}]},{"name":"輪胎","items":[{"label":"Continental GP5000","price":1850},{"label":"Schwalbe Pro One","price":1650},{"label":"Maxxis Rekon Race","price":1450},{"label":"Vittoria Corsa Pro","price":1900}]},{"name":"輪框","items":[{"label":"Zipp 303 Firecrest","price":42000},{"label":"DT Swiss ARC 1100","price":38000},{"label":"Mavic Cosmic SL","price":31000}]}]</script>

<script>
const $ = id => document.getElementById(id);
const fmt = n => "NT$ " + n.toLocaleString("en-US");
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
let data = JSON.parse($("data").textContent);
let art = null, draft = null;

/* ===== 客人檢視 ===== */
let rows = [];
function renderView() {
  const list = $("list"); list.replaceChildren(); rows = [];
  if (!data.length) list.append(el("div", { className: "row", textContent: "目前沒有任何分類。" }));
  data.forEach((cat, ci) => {
    const sel = el("select", { id: "cat" + ci }, el("option", { value: "", textContent: "請選擇品項" }));
    cat.items.forEach((it, i) => sel.append(el("option", { value: i, textContent: it.label })));
    const price = el("div", { className: "price empty", textContent: "—" });
    price.setAttribute("aria-live", "polite");
    sel.addEventListener("change", update);
    list.append(el("div", { className: "row" }, el("label", { className: "cat", htmlFor: "cat" + ci, textContent: cat.name }), sel, price));
    rows.push({ sel, price, cat });
  });
  update();
}
function update() {
  let total = 0;
  rows.forEach(({ sel, price, cat }) => {
    if (sel.value === "") { price.textContent = "—"; price.className = "price empty"; return; }
    const p = cat.items[+sel.value].price; total += p;
    price.textContent = fmt(p); price.className = "price";
  });
  $("sum").textContent = fmt(total);
}
$("reset").addEventListener("click", () => { rows.forEach(r => r.sel.value = ""); update(); });

/* ===== 管理模式 ===== */
function renderAdmin() {
  const box = $("admin"); box.replaceChildren();
  const msg = el("div", { className: "msg", id: "msg" });
  const save = el("button", { className: "primary", type: "button", textContent: "儲存並發佈" });
  save.onclick = saveAll;
  const cancel = el("button", { type: "button", textContent: "取消" });
  cancel.onclick = closeAdmin;
  box.append(el("div", { className: "bar" }, save, cancel, el("span", { className: "grow", textContent: "修改完成後按「儲存並發佈」，客人才會看到新內容。" })));

  const card = el("div", { className: "card" });
  draft.forEach((cat, ci) => {
    const name = el("input", { value: cat.name, placeholder: "分類名稱（例如：車架）" });
    name.oninput = () => cat.name = name.value;
    const up = el("button", { className: "small", type: "button", textContent: "上移", disabled: ci === 0 });
    up.onclick = () => { draft.splice(ci - 1, 0, draft.splice(ci, 1)[0]); renderAdmin(); };
    const delCat = el("button", { className: "small danger", type: "button", textContent: "刪除分類" });
    delCat.onclick = () => { if (confirm("確定刪除「" + (cat.name || "未命名") + "」整個分類？")) { draft.splice(ci, 1); renderAdmin(); } };
    const wrap = el("div", { className: "acat" }, el("div", { className: "acat-head" }, name, up, delCat));
    cat.items.forEach((it, ii) => {
      const l = el("input", { value: it.label, placeholder: "品牌 / 型號" });
      l.oninput = () => it.label = l.value;
      const p = el("input", { type: "number", min: 0, step: 1, inputMode: "numeric", value: it.price, placeholder: "金額" });
      p.oninput = () => it.price = p.value;
      const d = el("button", { className: "small danger", type: "button", textContent: "刪除" });
      d.onclick = () => { cat.items.splice(ii, 1); renderAdmin(); };
      wrap.append(el("div", { className: "item" }, l, p, d));
    });
    const add = el("button", { className: "small", type: "button", textContent: "＋ 新增品項" });
    add.onclick = () => { cat.items.push({ label: "", price: "" }); renderAdmin(); };
    wrap.append(add);
    card.append(wrap);
  });
  box.append(card);
  const addCat = el("button", { type: "button", textContent: "＋ 新增分類", style: "margin-top:16px" });
  addCat.onclick = () => { draft.push({ name: "", items: [{ label: "", price: "" }] }); renderAdmin(); };
  box.append(addCat, msg);
}
function openAdmin() {
  draft = JSON.parse(JSON.stringify(data));
  renderAdmin(); $("view").hidden = true; $("admin").hidden = false; $("manage").hidden = true;
}
function closeAdmin() { $("admin").hidden = true; $("view").hidden = false; $("manage").hidden = false; draft = null; }
$("manage").addEventListener("click", openAdmin);

function clean() {
  const out = [];
  for (const c of draft) {
    const name = c.name.trim(); if (!name) continue;
    const items = [];
    for (const it of c.items) {
      const label = it.label.trim(), price = Number(it.price);
      if (!label && it.price === "") continue;
      if (!label || it.price === "" || !isFinite(price) || price < 0) return { error: "「" + name + "」裡有品項缺少名稱或金額不正確。" };
      items.push({ label, price: Math.round(price) });
    }
    out.push({ name, items });
  }
  return { out };
}
function buildHtml(newData) {
  const c = document.documentElement.cloneNode(true);
  c.querySelector("#data").textContent = JSON.stringify(newData).replace(/</g, "\\u003c");
  c.querySelector("#list").replaceChildren();
  c.querySelector("#admin").replaceChildren();
  c.querySelector("#admin").hidden = true;
  c.querySelector("#view").hidden = false;
  c.querySelector("#manage").hidden = true;
  c.querySelector("#sum").textContent = "NT$ 0";
  return "<!DOCTYPE html>\n" + c.outerHTML;
}
async function saveAll() {
  const msg = $("msg"); msg.textContent = "";
  const r = clean();
  if (r.error) { msg.textContent = r.error; return; }
  msg.style.color = "var(--mute)"; msg.textContent = "發佈中…";
  try { await art.publish(buildHtml(r.out)); }
  catch (e) { msg.style.color = "var(--danger)"; msg.textContent = "發佈失敗，請稍後再試。"; }
}

/* ===== 啟動：只有頁面擁有者／編輯者看得到「管理模式」 ===== */
renderView();
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const [a, u] = await Promise.all([claude.use("artifact"), claude.use("user")]);
    if (a && u && (u.isOwner() || u.canEdit())) { art = a; $("manage").hidden = false; }
  } catch (e) {}
})();
</script>


</body></html>
